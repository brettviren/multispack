# Linux distribution survey catalog for multispack.
#
# WHAT THIS IS
#   For each distribution release we record the glibc and the DEFAULT gcc it
#   natively provides from its base repositories, plus its official container
#   image, package family/manager, release and end-of-life dates.  `mspack
#   survey` collates this into "for a given glibc floor, which distros can run
#   the resulting binaries" (a binary built against glibc X runs on any distro
#   whose glibc >= X -- glibc keeps forward compatibility via symbol versioning).
#
# HOW IT IS USED
#   1. `mspack survey`         -- the glibc-coverage report (default).
#   2. `mspack survey table`   -- this catalog as a table.
#   3. `mspack survey probe`   -- MECHANICALLY refresh glibc/gcc by pulling each
#                                 `image` and reading it (getconf/ldd + the pkg
#                                 manager); rewrites the probed fields in place.
#   4. base-distro resolution  -- `BASE_DISTRO=<key>` (config/CLI) resolves
#                                 `image` (-> BUILDER_BASE) and `pkg_manager`
#                                 (-> which builder Containerfile) from here.
#
# HOW TO REFRESH
#   - Mechanical (glibc + best-effort gcc):  mspack survey probe [KEY...]
#   - Editorial (release/eol dates, adding new releases, notes): re-run the LLM
#     web-search analysis that seeded this file and edit below.  Keep entries
#     terse and cite the moving facts in `notes`.
#
# FIELDS
#   distro       human name         family       package format: rpm | deb
#   release      version string     pkg_manager  dnf | apt | zypper
#   glibc        e.g. "2.28"        image        official container image ref
#   gcc          DEFAULT base gcc   released/eol  YYYY-MM (best available)
#
# BOOTSTRAP BASES
#   A distro can seed the bootstrap ladder only if a builder Containerfile exists
#   for its pkg_manager: dnf -> Containerfile.builder, apt ->
#   Containerfile.builder-debian.  zypper (SLES/openSUSE) is surveyed but not yet
#   a supported base (no builder); pick an rpm/dnf or deb/apt distro, or set
#   BUILDER_BASE explicitly.
#
schema: 1
updated: 2026-09+probe
method: llm-web-search+probe

